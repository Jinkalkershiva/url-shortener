<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkSnap — URL Shortener</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0c29;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated background ── */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }
        .bg-orb-1 { width: 500px; height: 500px; background: #667eea; top: -120px; left: -100px; animation-delay: 0s; }
        .bg-orb-2 { width: 400px; height: 400px; background: #f093fb; bottom: -100px; right: -80px; animation-delay: 3s; }
        .bg-orb-3 { width: 300px; height: 300px; background: #4facfe; top: 40%; left: 50%; animation-delay: 5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50%       { transform: translateY(-30px) scale(1.05); }
        }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 28px;
            padding: 52px 44px;
            width: 100%;
            max-width: 560px;
            animation: slideUp 0.6s cubic-bezier(.22,1,.36,1);
            box-shadow: 0 32px 80px rgba(0,0,0,0.5);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Header ── */
        .logo-wrap {
            text-align: center;
            margin-bottom: 6px;
        }
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #667eea, #f093fb);
            border-radius: 18px;
            font-size: 2rem;
            box-shadow: 0 8px 24px rgba(102,126,234,0.5);
            animation: pulse 2.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 24px rgba(102,126,234,0.5); }
            50%       { box-shadow: 0 8px 40px rgba(240,147,251,0.7); }
        }

        h1 {
            text-align: center;
            font-size: 1.9rem;
            font-weight: 800;
            color: #fff;
            margin: 14px 0 6px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.55);
            font-size: 0.93rem;
            margin-bottom: 36px;
        }

        /* ── Input area ── */
        .input-wrapper {
            position: relative;
            margin-bottom: 6px;
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 110px 15px 46px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 14px;
            font-size: 0.97rem;
            color: #fff;
            outline: none;
            background: rgba(255,255,255,0.08);
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }
        input[type="text"]::placeholder { color: rgba(255,255,255,0.35); }
        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.25);
            background: rgba(255,255,255,0.12);
        }
        input[type="text"].valid   { border-color: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,0.2); }
        input[type="text"].invalid { border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,0.2); }

        .paste-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            padding: 6px 12px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: rgba(255,255,255,0.7);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .paste-btn:hover { background: rgba(255,255,255,0.22); color: #fff; }

        .input-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            min-height: 20px;
        }
        .error-msg  { color: #f87171; font-size: 0.82rem; }
        .valid-msg  { color: #4ade80; font-size: 0.82rem; }
        .char-count { color: rgba(255,255,255,0.35); font-size: 0.78rem; margin-left: auto; }

        /* ── Submit button ── */
        .btn-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            color: #fff;
            box-shadow: 0 6px 24px rgba(102,126,234,0.5);
            transition: transform 0.15s, box-shadow 0.15s;
            animation: gradientShift 4s ease infinite;
        }
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(102,126,234,0.6);
        }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            animation: none;
        }
        .btn-submit .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple {
            to { transform: scale(4); opacity: 0; }
        }

        /* ── Spinner ── */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Stats bar ── */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .stat { text-align: center; }
        .stat-num {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label { font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-top: 2px; }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .card { padding: 36px 24px; }
            h1 { font-size: 1.5rem; }
            .stats-bar { gap: 16px; }
        }
    </style>
</head>
<body>

<!-- Animated background orbs -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<div class="card">
    <div class="logo-wrap">
        <div class="logo-icon">🔗</div>
    </div>
    <h1>LinkSnap</h1>
    <p class="subtitle">Shorten, share and track your links in seconds</p>

    <form th:action="@{/shorten}" th:object="${request}" method="post" id="shortenForm">
        <div class="input-wrapper">
            <span class="input-icon" id="inputIcon">🌐</span>
            <input type="text"
                   th:field="*{url}"
                   th:classappend="${#fields.hasErrors('url')} ? 'invalid'"
                   id="urlInput"
                   placeholder="Paste your long URL here..."
                   autocomplete="off"
                   oninput="onUrlInput(this)"/>
            <button type="button" class="paste-btn" onclick="pasteUrl()">📋 Paste</button>
        </div>

        <div class="input-meta">
            <span class="error-msg" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></span>
            <span class="valid-msg" id="validMsg" style="display:none">✓ Valid URL</span>
            <span class="char-count" id="charCount"></span>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn" onclick="addRipple(event, this)">
            ✂️ &nbsp;Shorten URL
        </button>
    </form>

    <div class="stats-bar">
        <div class="stat"><div class="stat-num" id="cnt1">0</div><div class="stat-label">Links Created</div></div>
        <div class="stat"><div class="stat-num">99.9%</div><div class="stat-label">Uptime</div></div>
        <div class="stat"><div class="stat-num">&lt;1ms</div><div class="stat-label">Redirect Speed</div></div>
    </div>
</div>

<script>
    // ── Animated counter ──
    function animateCount(el, target, duration) {
        let start = 0, step = target / (duration / 16);
        const tick = () => {
            start = Math.min(start + step, target);
            el.textContent = Math.floor(start).toLocaleString() + '+';
            if (start < target) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
    }
    animateCount(document.getElementById('cnt1'), 12847, 1800);

    // ── Real-time URL validation ──
    function onUrlInput(input) {
        const val = input.value.trim();
        const charCount = document.getElementById('charCount');
        const validMsg  = document.getElementById('validMsg');
        const icon      = document.getElementById('inputIcon');

        charCount.textContent = val.length > 0 ? val.length + ' chars' : '';

        input.classList.remove('valid', 'invalid');
        validMsg.style.display = 'none';

        if (val.length === 0) { icon.textContent = '🌐'; return; }

        try {
            const url = new URL(val);
            if (url.protocol === 'http:' || url.protocol === 'https:') {
                input.classList.add('valid');
                validMsg.style.display = 'inline';
                icon.textContent = '✅';
            } else {
                input.classList.add('invalid');
                icon.textContent = '❌';
            }
        } catch {
            input.classList.add('invalid');
            icon.textContent = '❌';
        }
    }

    // ── Paste from clipboard ──
    async function pasteUrl() {
        try {
            const text = await navigator.clipboard.readText();
            const input = document.getElementById('urlInput');
            input.value = text;
            onUrlInput(input);
            input.focus();
        } catch { alert('Allow clipboard access to use paste.'); }
    }

    // ── Ripple effect ──
    function addRipple(e, btn) {
        const rect = btn.getBoundingClientRect();
        const r = document.createElement('span');
        r.className = 'ripple';
        const size = Math.max(rect.width, rect.height);
        r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
        btn.appendChild(r);
        setTimeout(() => r.remove(), 700);
    }

    // ── Loading state on submit ──
    document.getElementById('shortenForm').addEventListener('submit', function () {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Shortening your link...';
    });

    // ── Trigger validation on load if server returned error ──
    window.addEventListener('load', () => {
        const input = document.getElementById('urlInput');
        if (input.value) onUrlInput(input);
    });
</script>
</body>
</html>
